[package]
name = "iptv-player"
version = "0.1.0"
description = "Desktop IPTV player for Xtream Codes providers"
authors = ["Argyris"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "iptv_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
url = "2.5"
rand = "0.9"
tokio = { version = "1", features = ["net", "sync"] }
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
