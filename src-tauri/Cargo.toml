[package]
name = "infinite-iptv"
version = "0.2.0"
description = "Desktop IPTV player for Xtream Codes providers"
authors = ["Argyris"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "infinite_iptv_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
log = "0.4"
thiserror = "2"
url = "2.5"
rand = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "net", "sync", "time"] }
axum = "0.8"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
quick-xml = { version = "0.42", features = ["escape-html"] }
flate2 = "1.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "objc2", "CVBase"] }
objc2-open-gl = { version = "0.3", default-features = false, features = ["std", "CGLTypes", "CGLCurrent"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", features = [
  "NSEvent",
  "NSResponder",
  "NSTrackingArea",
  "NSView",
  "NSWindow",
] }
objc2-quartz-core = { version = "0.3", features = [
  "CALayer",
  "CAOpenGLLayer",
  "CATransaction",
  "objc2-core-foundation",
  "objc2-core-video",
  "objc2-open-gl",
] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
