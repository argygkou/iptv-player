name: Release

on:
  push:
    branches: [main]
  # Build an installer from any branch to try it out; nothing is published.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in this workflow rather than on `release: published`, because releases created with GITHUB_TOKEN
  # don't trigger other workflows.
  windows:
    name: Windows installer
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Fetch libmpv
        run: npm run fetch-libmpv
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty on a manual run, which only builds.
          tagName: ${{ needs.release-please.outputs.tag_name }}
      - name: Check that libmpv is bundled
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/target/release/libmpv-2.dll)) { throw 'libmpv-2.dll missing from the release build' }
          if (-not (Test-Path src-tauri/target/release/mpv/scripts/modernz.lua)) { throw 'ModernZ missing from the release build' }
      - name: Show player package sources
        run: cat src-tauri/lib/*.json
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: infinite-iptv-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
