name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,scss}"
      - run: npm run build
      - run: npm test -- --watch=false
      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test

  windows:
    # The native player only compiles on Windows, so lint and test it here too. Installers are built only by
    # the release workflow.
    name: Windows lint and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri-build checks that the bundled resources (libmpv, ModernZ) exist, even for clippy.
      - name: Fetch libmpv
        run: npm run fetch-libmpv
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test

  macos:
    # Keychain storage and the native player have macOS-only code.
    name: macOS lint and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # tauri-build checks that the bundled resources (libmpv, ModernZ) exist, even for clippy; the mpv tests
      # also run against this libmpv.
      - name: Bundle libmpv
        run: |
          brew install mpv
          npm run fetch-libmpv
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test
