name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install webview build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npx prettier --check "src/**/*.{ts,html,scss}"
      - run: npm run build
      - run: npm test -- --watch=false
      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test

  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Fetch libmpv
        run: npm run fetch-libmpv
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run bundle -- --bundles nsis,msi
      # The native player only compiles on Windows, so lint and test it here too.
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test
      - name: Check that libmpv is bundled
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/target/release/libmpv-2.dll)) { throw 'libmpv-2.dll missing from the release build' }
          if (-not (Test-Path src-tauri/target/release/mpv/scripts/uosc/main.lua)) { throw 'uosc missing from the release build' }
      - name: Show player package sources
        run: cat src-tauri/lib/*.json
      - uses: actions/upload-artifact@v4
        with:
          name: infinite-iptv-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
